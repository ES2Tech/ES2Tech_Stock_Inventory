<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Google 시트 검색</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 6px;
      text-align: center;
    }
    th {
      background-color: #f3f3f3;
    }
    tr:hover {
      background-color: #f9f9f9;
    }
    #searchBox {
      margin: 10px 0;
      padding: 5px;
      width: 200px;
    }
    #columnSelect {
      margin: 10px 0;
      padding: 5px;
    }
  </style>
</head>
<body>
  <h1>Google 시트 데이터</h1>
  <h2>장비 추가</h2>
  <form id="addForm">
    <input placeholder="BOX.No" id="boxNo" />
    <input placeholder="담당부서" id="dept" />
    <input placeholder="담당팀장" id="leader" />
    <input placeholder="품목분류" id="category" />
    <input placeholder="Vendor" id="vendor" />
    <input placeholder="보관장소" id="storage" />
    <input placeholder="Location" id="location" />
    <input placeholder="현재 위치" id="position" />
    <input placeholder="Product" id="product" />
    <input placeholder="Serial" id="serial" />
    <input placeholder="장비상태" id="status" />
    <input placeholder="수량" id="qty" type="number" />
    <input placeholder="현재수량" id="currentQty" type="number" />
    <input placeholder="담당자" id="owner" />
    <input placeholder="등록일 (YYYY-MM-DD)" id="date" />
    <input placeholder="비고(사유)" id="note" />
    <input placeholder="확인 여부" id="confirm" />
  <button onclick="editRow()">수정</button>
    <button type="button" onclick="addRow()">추가</button>
  </form>
  
  <label for="columnSelect">검색할 열:</label>
  <select id="columnSelect"></select>
  <input type="text" id="searchBox" placeholder="검색어 입력..." />
  <button onclick="refreshSheet()">새로고침</button>

  <table id="dataTable"></table>

  <script>
    let fullData = [];
    let headers = [];
    let selectedRowIndex = null;
    let originalValues = [];

    const SHEET_URL = "https://opensheet.elk.sh/1FzxaxY9bmx2lY9QXCPADwHuHKqwhlNr4Q0_D-r8SsvE/Sheet1";
    const table = document.getElementById("dataTable");
    const searchBox = document.getElementById("searchBox");
    const columnSelect = document.getElementById("columnSelect");

    fetch(SHEET_URL)
      .then(res => res.json())
      .then(data => {
        fullData = data;
        if (data.length === 0) {
          table.innerHTML = "<tr><td>데이터 없음</td></tr>";
          return;
        }

        headers = Object.keys(data[0]);
        headers.forEach(header => {
          const option = document.createElement("option");
          option.value = header;
          option.textContent = header;
          columnSelect.appendChild(option);
        });

        drawTable(data);
        searchBox.addEventListener("input", filterTable);
        columnSelect.addEventListener("change", filterTable);
      });

    function drawTable(data) {
      table.innerHTML = "";
      const headerRow = document.createElement("tr");
      headers.forEach(header => {
        const th = document.createElement("th");
        th.innerText = header;
        headerRow.appendChild(th);
      });
      table.appendChild(headerRow);

      data.forEach((row, index) => {
        const tr = document.createElement("tr");

        headers.forEach(header => {
          const td = document.createElement("td");
          td.innerText = row[header] || "";
          tr.appendChild(td);
        });

        tr.addEventListener("click", () => {
          selectedRowIndex = index + 2;
          const cells = tr.querySelectorAll("td");
          originalValues = Array.from(cells).map(td => td.innerText.trim());

          document.getElementById("boxNo").value      = originalValues[1] || "";
          document.getElementById("dept").value       = originalValues[2] || "";
          document.getElementById("leader").value     = originalValues[3] || "";
          document.getElementById("category").value   = originalValues[4] || "";
          document.getElementById("vendor").value     = originalValues[5] || "";
          document.getElementById("storage").value    = originalValues[6] || "";
          document.getElementById("location").value   = originalValues[7] || "";
          document.getElementById("position").value   = originalValues[8] || "";
          document.getElementById("product").value    = originalValues[9] || "";
          document.getElementById("serial").value     = originalValues[10] || "";
          document.getElementById("status").value     = originalValues[11] || "";
          document.getElementById("qty").value        = originalValues[12] || "";
          document.getElementById("currentQty").value = originalValues[13] || "";
          document.getElementById("owner").value      = originalValues[14] || "";
          document.getElementById("date").value       = originalValues[15] || "";
          document.getElementById("note").value       = originalValues[16] || "";
          document.getElementById("confirm").value    = originalValues[17] || "";
        });

        table.appendChild(tr);
      });
    }

    function filterTable() {
      const keyword = searchBox.value.toLowerCase();
      const selectedColumn = columnSelect.value;

      const filtered = fullData.filter(row => {
        const cell = row[selectedColumn];
        return cell && cell.toLowerCase().includes(keyword);
      });

      drawTable(filtered);
    }

    function getValueOrDash(id) {
      const value = document.getElementById(id).value;
      return value.trim() === "" ? "-" : value.trim();
    }

    function getInputOrOriginal(id, index) {
      const input = document.getElementById(id).value.trim();
      return input === "" ? originalValues[index] || "-" : input;
    }

    function refreshSheet() {
      location.href = location.href.split('?')[0] + "?t=" + Date.now();
    }

    async function editRow() {
      if (!selectedRowIndex) {
        alert("수정할 행을 먼저 선택하세요.");
        return;
      }

      const values = [
        originalValues[0],
        getInputOrOriginal("boxNo", 1),
        getInputOrOriginal("dept", 2),
        getInputOrOriginal("leader", 3),
        getInputOrOriginal("category", 4),
        getInputOrOriginal("vendor", 5),
        getInputOrOriginal("storage", 6),
        getInputOrOriginal("location", 7),
        getInputOrOriginal("position", 8),
        getInputOrOriginal("product", 9),
        getInputOrOriginal("serial", 10),
        getInputOrOriginal("status", 11),
        getInputOrOriginal("qty", 12),
        getInputOrOriginal("currentQty", 13),
        getInputOrOriginal("owner", 14),
        getInputOrOriginal("date", 15),
        getInputOrOriginal("note", 16),
        getInputOrOriginal("confirm", 17)
      ];

      const res = await fetch("https://es2tech-stock-inventory.onrender.com/edit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ row_number: selectedRowIndex, values })
      });

      if (res.ok) {
        alert("수정 완료!");
        refreshSheet();
      } else {
        alert("수정 실패: " + res.statusText);
      }
    }

    async function addRow() {
      const values = [
        "-",
        getValueOrDash("boxNo"),
        getValueOrDash("dept"),
        getValueOrDash("leader"),
        getValueOrDash("category"),
        getValueOrDash("vendor"),
        getValueOrDash("storage"),
        getValueOrDash("location"),
        getValueOrDash("position"),
        getValueOrDash("product"),
        getValueOrDash("serial"),
        getValueOrDash("status"),
        getValueOrDash("qty"),
        getValueOrDash("currentQty"),
        getValueOrDash("owner"),
        getValueOrDash("date"),
        getValueOrDash("note"),
        getValueOrDash("confirm")
      ];

      const res = await fetch("https://es2tech-stock-inventory.onrender.com/append", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ values })
      });

      if (res.ok) {
        alert("추가 완료!");
        refreshSheet();
      } else {
        alert("추가 실패: " + res.statusText);
      }
    }
  </script>
</body>
</html>
