<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Google 시트 검색</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 6px;
      text-align: center;
    }
    th {
      background-color: #f3f3f3;
    }
    tr:hover {
      background-color: #f9f9f9;
    }
    #searchBox {
      margin: 10px 0;
      padding: 5px;
      width: 200px;
    }
    #columnSelect {
      margin: 10px 0;
      padding: 5px;
    }
  </style>
</head>
<body>
  <h1>Google 시트 데이터</h1>

  <label for="columnSelect">검색할 열:</label>
  <select id="columnSelect"></select>

  <input type="text" id="searchBox" placeholder="검색어 입력..." />
  <input id="serial" placeholder="Serial 번호" />
  <input id="product" placeholder="Product" />
  <button onclick="addRow()">추가</button>

  <table id="dataTable"></table>

  <script>
    let fullData = [];
    let headers = [];

    const SHEET_URL = "https://opensheet.elk.sh/1FzxaxY9bmx2lY9QXCPADwHuHKqwhlNr4Q0_D-r8SsvE/Sheet1";

    const table = document.getElementById("dataTable");
    const searchBox = document.getElementById("searchBox");
    const columnSelect = document.getElementById("columnSelect");

    fetch(SHEET_URL)
      .then(res => res.json())
      .then(data => {
        fullData = data;
        if (data.length === 0) {
          table.innerHTML = "<tr><td>데이터 없음</td></tr>";
          return;
        }

        headers = Object.keys(data[0]);

        // 드롭다운 옵션 채우기
        headers.forEach(header => {
          const option = document.createElement("option");
          option.value = header;
          option.textContent = header;
          columnSelect.appendChild(option);
        });

        drawTable(data);

        // 검색 이벤트 연결
        searchBox.addEventListener("input", filterTable);
        columnSelect.addEventListener("change", filterTable);
      });

    function drawTable(data) {
      table.innerHTML = "";
      const headerRow = document.createElement("tr");
      headers.forEach(header => {
        const th = document.createElement("th");
        th.innerText = header;
        headerRow.appendChild(th);
      });
      table.appendChild(headerRow);

      data.forEach(row => {
        const tr = document.createElement("tr");
        headers.forEach(header => {
          const td = document.createElement("td");
          td.innerText = row[header] || "";
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
    }

    function filterTable() {
      const keyword = searchBox.value.toLowerCase();
      const selectedColumn = columnSelect.value;

      const filtered = fullData.filter(row => {
        const cell = row[selectedColumn];
        return cell && cell.toLowerCase().includes(keyword);
      });

      drawTable(filtered);
    }
	async function addRow() {
    const serial = document.getElementById("serial").value;
    const product = document.getElementById("product").value;

    const values = [
      "104", "기술2팀", "OOO", "Stock", "Cisco", "베란다", "-", "2003-2-3",
      product, serial, "정상", 1, 1, "XXX", "2022-12-30", "테스트", "확인"
    ];

    const response = await fetch("https://es2tech-stock-inventory.onrender.com/append", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ values })
    });

    if (response.ok) {
      alert("추가 성공!");
    } else {
      alert("실패: " + response.statusText);
    }
  }
  </script>
</body>
</html>
